<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trainingsplan" />
    <title>Trainingsplan</title>
    <script>
      // Set theme before stylesheet applies to avoid a flash on reload.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-row">
        <h1 class="app-title">Trainingsplan</h1>
        <div class="app-header-actions">
          <div id="mode-actions" class="mode-actions"></div>
          <span id="save-status" class="save-status" aria-live="polite"></span>
          <button
            id="profile-avatar"
            class="theme-toggle profile-avatar"
            type="button"
            aria-label="Profilmenü"
            title="Profilmenü"
            aria-haspopup="menu"
            hidden
          ></button>
        </div>
      </div>
    </header>

    <main id="main" class="app-main"></main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
