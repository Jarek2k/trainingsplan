<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#742a4c"/>
      <stop offset="1" stop-color="#56193a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4d70"/>
      <stop offset="1" stop-color="#163655"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155f3f"/>
      <stop offset="1" stop-color="#0e4a32"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a70"/>
      <stop offset="1" stop-color="#382c57"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Plan name placeholder (two dimmed bars suggest header) -->
  <rect x="20" y="22" width="92" height="5" rx="2.5" fill="#5a6b85" opacity="0.55"/>
  <rect x="20" y="32" width="56" height="3" rx="1.5" fill="#5a6b85" opacity="0.35"/>

  <!-- Row 1: Rose / Brust -->
  <g>
    <rect x="20" y="58" width="140" height="22" rx="6" fill="url(#rose)" stroke="#ffd1e0" stroke-opacity="0.20" stroke-width="1"/>
    <rect x="20" y="58" width="3" height="22" rx="1.5" fill="#ffd1e0" opacity="0.95"/>
    <rect x="30" y="65" width="46" height="3.2" rx="1.6" fill="#ffd1e0" opacity="0.9"/>
    <rect x="30" y="72" width="24" height="2.4" rx="1.2" fill="#ffd1e0" opacity="0.45"/>
    <rect x="135" y="68" width="18" height="4" rx="1.5" fill="#ffd1e0" opacity="0.85"/>
  </g>

  <!-- Row 2: Blue / Rücken -->
  <g>
    <rect x="20" y="86" width="140" height="22" rx="6" fill="url(#blue)" stroke="#c6e3ff" stroke-opacity="0.20" stroke-width="1"/>
    <rect x="20" y="86" width="3" height="22" rx="1.5" fill="#c6e3ff" opacity="0.95"/>
    <rect x="30" y="93" width="54" height="3.2" rx="1.6" fill="#c6e3ff" opacity="0.9"/>
    <rect x="30" y="100" width="28" height="2.4" rx="1.2" fill="#c6e3ff" opacity="0.45"/>
    <rect x="135" y="96" width="18" height="4" rx="1.5" fill="#c6e3ff" opacity="0.85"/>
  </g>

  <!-- Row 3: Emerald / Beine -->
  <g>
    <rect x="20" y="114" width="140" height="22" rx="6" fill="url(#emerald)" stroke="#6eebab" stroke-opacity="0.20" stroke-width="1"/>
    <rect x="20" y="114" width="3" height="22" rx="1.5" fill="#6eebab" opacity="0.95"/>
    <rect x="30" y="121" width="40" height="3.2" rx="1.6" fill="#6eebab" opacity="0.9"/>
    <rect x="30" y="128" width="22" height="2.4" rx="1.2" fill="#6eebab" opacity="0.45"/>
    <rect x="135" y="124" width="18" height="4" rx="1.5" fill="#6eebab" opacity="0.85"/>
  </g>

  <!-- Row 4: Violet / Bizeps -->
  <g>
    <rect x="20" y="142" width="140" height="22" rx="6" fill="url(#violet)" stroke="#d8c8ff" stroke-opacity="0.20" stroke-width="1"/>
    <rect x="20" y="142" width="3" height="22" rx="1.5" fill="#d8c8ff" opacity="0.95"/>
    <rect x="30" y="149" width="48" height="3.2" rx="1.6" fill="#d8c8ff" opacity="0.9"/>
    <rect x="30" y="156" width="26" height="2.4" rx="1.2" fill="#d8c8ff" opacity="0.45"/>
    <rect x="135" y="152" width="18" height="4" rx="1.5" fill="#d8c8ff" opacity="0.85"/>
  </g>
</svg>
