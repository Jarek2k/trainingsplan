<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2d50"/>
      <stop offset="1" stop-color="#561a3a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#225578"/>
      <stop offset="1" stop-color="#163655"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#176546"/>
      <stop offset="1" stop-color="#0d4a32"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#503e78"/>
      <stop offset="1" stop-color="#382c57"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Plan-name placeholder bars at the top -->
  <rect x="14" y="14" width="100" height="6" rx="3" fill="#6a7a92" opacity="0.65"/>
  <rect x="14" y="24" width="58" height="4" rx="2" fill="#6a7a92" opacity="0.35"/>

  <!-- Row 1: Rose / Brust -->
  <g>
    <rect x="14" y="38" width="152" height="28" rx="7" fill="url(#rose)" stroke="#ffd1e0" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="14" y="38" width="4" height="28" rx="2" fill="#ffd1e0" opacity="0.95"/>
    <rect x="26" y="45" width="58" height="4.2" rx="2.1" fill="#ffd1e0" opacity="0.92"/>
    <rect x="26" y="54" width="30" height="3.2" rx="1.6" fill="#ffd1e0" opacity="0.5"/>
    <rect x="138" y="48" width="22" height="6" rx="2" fill="#ffd1e0" opacity="0.88"/>
  </g>

  <!-- Row 2: Blue / Rücken -->
  <g>
    <rect x="14" y="72" width="152" height="28" rx="7" fill="url(#blue)" stroke="#c6e3ff" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="14" y="72" width="4" height="28" rx="2" fill="#c6e3ff" opacity="0.95"/>
    <rect x="26" y="79" width="66" height="4.2" rx="2.1" fill="#c6e3ff" opacity="0.92"/>
    <rect x="26" y="88" width="34" height="3.2" rx="1.6" fill="#c6e3ff" opacity="0.5"/>
    <rect x="138" y="82" width="22" height="6" rx="2" fill="#c6e3ff" opacity="0.88"/>
  </g>

  <!-- Row 3: Emerald / Beine -->
  <g>
    <rect x="14" y="106" width="152" height="28" rx="7" fill="url(#emerald)" stroke="#6eebab" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="14" y="106" width="4" height="28" rx="2" fill="#6eebab" opacity="0.95"/>
    <rect x="26" y="113" width="50" height="4.2" rx="2.1" fill="#6eebab" opacity="0.92"/>
    <rect x="26" y="122" width="28" height="3.2" rx="1.6" fill="#6eebab" opacity="0.5"/>
    <rect x="138" y="116" width="22" height="6" rx="2" fill="#6eebab" opacity="0.88"/>
  </g>

  <!-- Row 4: Violet / Bizeps -->
  <g>
    <rect x="14" y="140" width="152" height="28" rx="7" fill="url(#violet)" stroke="#d8c8ff" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="14" y="140" width="4" height="28" rx="2" fill="#d8c8ff" opacity="0.95"/>
    <rect x="26" y="147" width="60" height="4.2" rx="2.1" fill="#d8c8ff" opacity="0.92"/>
    <rect x="26" y="156" width="32" height="3.2" rx="1.6" fill="#d8c8ff" opacity="0.5"/>
    <rect x="138" y="150" width="22" height="6" rx="2" fill="#d8c8ff" opacity="0.88"/>
  </g>
</svg>
